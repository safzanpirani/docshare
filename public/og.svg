<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="docshare">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a10"/>
      <stop offset="1" stop-color="#1a1326"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(80,80)">
    <rect width="72" height="72" rx="14" fill="#a78bfa"/>
    <text x="36" y="50" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="32" font-weight="700" fill="#160f2e" letter-spacing="-2">ds</text>
  </g>

  <!-- wordmark -->
  <text x="80" y="340"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="148" font-weight="800" fill="#e9e7f0" letter-spacing="-6">docshare</text>

  <!-- tagline -->
  <text x="80" y="410"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="500" fill="#a78bfa" letter-spacing="-0.5">share files &amp; video with coding agents</text>

  <!-- url + features -->
  <text x="80" y="500"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="24" font-weight="500" fill="#8d87a0">docs.safzan.dev</text>
  <text x="80" y="540"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" font-weight="400" fill="#565070">paste · drop · pick · 300 MB · 24h auto-delete</text>

  <!-- decorative file stack -->
  <g transform="translate(820,180)" opacity="0.85">
    <rect x="60" y="60" width="240" height="300" rx="14" fill="#1b1827" stroke="#38324a" stroke-width="2"/>
    <rect x="40" y="40" width="240" height="300" rx="14" fill="#221d33" stroke="#4a4264" stroke-width="2"/>
    <rect x="20" y="20" width="240" height="300" rx="14" fill="#2a2440" stroke="#a78bfa" stroke-width="2"/>
    <!-- play triangle -->
    <circle cx="140" cy="170" r="50" fill="#a78bfa"/>
    <polygon points="125,145 125,195 170,170" fill="#160f2e"/>
  </g>
</svg>
